name: Deploy to GitHub Pages

on:
  push:
    # main is the intended source. The feature branch is listed so the site can
    # go live before the pull request is merged — remove it once it is merged.
    branches: [main, claude/pharmacy-stock-log-09atdt]
  workflow_dispatch:

# allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a run that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # turns Pages on for the repository if it is not already enabled
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # the site is plain static files, so the repository root is the site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

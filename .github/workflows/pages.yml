name: Deploy to GitHub Pages

on:
  # Pages only deploys from the default branch: the github-pages environment
  # rejects a run from any other branch before its first step, so this must
  # stay as main.
  push:
    branches: [main]
  workflow_dispatch:

# allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a run that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # turns Pages on for the repository if it is not already enabled
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # the site is plain static files, so the repository root is the site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
